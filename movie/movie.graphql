type Query {
    movie_with_id(_id: String!): Movie
    movie_with_title(title: String!): Movie
    all_movies: [Movie]
}

type Mutation {
    add_movie(title: String!, director: String!, rating: Float!): Movie
    update_movie_rating(_id: String!, rating: Float!): Movie
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
}